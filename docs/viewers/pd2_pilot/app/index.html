<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PD2 Xenium Pilot Viewer</title>
    <link rel="stylesheet" href="./style.css?v=20260604-gzip" />
  </head>
  <body>
    <header class="topbar">
      <div class="titleBlock">
        <h1>PD2 Xenium Pilot</h1>
        <div id="datasetMeta" class="metaLine">Loading...</div>
      </div>
      <div class="controls">
        <label>
          Color
          <select id="colorMode">
            <option value="cell_type">Cell type</option>
            <option value="gene">Gene</option>
          </select>
        </label>
        <label>
          Gene
          <input id="geneInput" list="geneList" value="Mef2c" autocomplete="off" />
          <datalist id="geneList"></datalist>
        </label>
        <label>
          Workspace
          <input id="workspaceHeight" type="range" min="620" max="1400" step="20" value="1220" />
        </label>
        <button id="resetPanels" class="controlButton" type="button">Reset</button>
      </div>
    </header>

    <main id="mainLayout" class="layout">
      <section id="viewerGrid" class="viewerGrid">
        <article id="spatialPanel" class="plotPanel">
          <div class="panelHeader">
            <h2>Spatial</h2>
            <div class="panelTools" data-nodrag="true">
              <button class="iconButton rotateButton" type="button" data-rotation="-90" title="Rotate spatial map left">↺</button>
              <button class="iconButton rotateButton" type="button" data-rotation="90" title="Rotate spatial map right">↻</button>
              <span id="rotationStatus" class="rotationStatus">0 deg</span>
              <span class="toolDivider" aria-hidden="true"></span>
              <button class="iconButton zoomButton" type="button" data-zoom="out" title="Zoom spatial map out">-</button>
              <button class="iconButton zoomButton" type="button" data-zoom="in" title="Zoom spatial map in">+</button>
              <button id="fitSpatial" class="fitButton" type="button" title="Fit spatial map to panel">Fit</button>
              <span id="zoomStatus" class="zoomStatus">1.0x</span>
              <span class="toolDivider" aria-hidden="true"></span>
              <label class="panelRangeLabel">
                Dot
                <input id="spatialPointSize" class="panelRange" type="range" min="0.6" max="20" step="0.1" value="1.8" />
              </label>
              <button class="iconButton pointButton" type="button" data-point-target="spatial" data-point-delta="-0.2" title="Decrease spatial dot size">-</button>
              <button class="iconButton pointButton" type="button" data-point-target="spatial" data-point-delta="0.2" title="Increase spatial dot size">+</button>
              <span id="spatialPointStatus" class="pointStatus">1.8</span>
              <span id="spatialStatus"></span>
            </div>
          </div>
          <canvas id="spatialCanvas"></canvas>
          <div class="resizeHandle resizeHandleN" data-resize="n" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleE" data-resize="e" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleS" data-resize="s" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleW" data-resize="w" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleNE" data-resize="ne" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleSE" data-resize="se" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleSW" data-resize="sw" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleNW" data-resize="nw" aria-hidden="true"></div>
        </article>
        <article id="umapPanel" class="plotPanel">
          <div class="panelHeader">
            <h2>UMAP</h2>
            <div class="panelTools" data-nodrag="true">
              <label class="panelRangeLabel">
                Dot
                <input id="umapPointSize" class="panelRange" type="range" min="0.6" max="5" step="0.2" value="1.8" />
              </label>
              <button class="iconButton pointButton" type="button" data-point-target="umap" data-point-delta="-0.2" title="Decrease UMAP dot size">-</button>
              <button class="iconButton pointButton" type="button" data-point-target="umap" data-point-delta="0.2" title="Increase UMAP dot size">+</button>
              <span id="umapPointStatus" class="pointStatus">1.8</span>
              <span id="umapStatus"></span>
            </div>
          </div>
          <canvas id="umapCanvas"></canvas>
          <div class="resizeHandle resizeHandleN" data-resize="n" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleE" data-resize="e" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleS" data-resize="s" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleW" data-resize="w" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleNE" data-resize="ne" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleSE" data-resize="se" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleSW" data-resize="sw" aria-hidden="true"></div>
          <div class="resizeHandle resizeHandleNW" data-resize="nw" aria-hidden="true"></div>
        </article>
      </section>

      <aside class="sidePanel">
        <section>
          <div class="sideHeader">
            <h2>Labels</h2>
            <div class="smallButtons">
              <button id="showAll" type="button">All</button>
              <button id="hideAll" type="button">None</button>
            </div>
          </div>
          <div id="legend" class="legend"></div>
        </section>
        <section>
          <h2>Cell</h2>
          <div id="hoverInfo" class="hoverInfo">Move over a point.</div>
        </section>
        <section>
          <h2>Export</h2>
          <dl class="fileList">
            <dt>Data</dt>
            <dd><a href="../data/pd2_cells.json.gz">pd2_cells.json.gz</a></dd>
            <dt>Annotation</dt>
            <dd><a href="../data/pd2_pilot_annotation.csv.gz">pd2_pilot_annotation.csv.gz</a></dd>
            <dt>Manifest</dt>
            <dd><a href="../data/pd2_pilot_export_manifest.json">pd2_pilot_export_manifest.json</a></dd>
          </dl>
        </section>
      </aside>
    </main>

    <script src="./app.js?v=20260604-gzip"></script>
  </body>
</html>
